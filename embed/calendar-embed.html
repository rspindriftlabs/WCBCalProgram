<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WCB Calendar</title>
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
  <style>
    /* Simple styles for the embeddable calendar */
    :root {
      --max-width: 900px;
      --primary: #366231;
      --background: #FFFFFF;
      --text-on-bg: #000000;
      --text-on-primary: #FFFFFF;
      --border: #FFFFFF;
    }

    * {
      box-sizing: border-box
    }

    html {
      overflow: hidden;
      height: auto;
      margin: 0;
      padding: 0;
    }

    body {
      overflow: hidden;
      height: auto;
      font-family: Georgia, 'Times New Roman', serif;
      margin: 16px;
      color: var(--text-on-bg);
      background: var(--background);
    }

    header {
      text-align: center;
      margin-bottom: 16px
    }

    header h1 {
      color: var(--text-on-bg);
      font-family: Georgia, 'Times New Roman', serif;
    }

    #calendar {
      max-width: 100%;
      width: var(--max-width);
      margin: 0 auto 24px
    }

    .subtitle {
      color: var(--text-on-bg);
      margin: 6px 0
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      height: auto;
      min-height: 0;
      max-width: 100%;
      overflow: hidden;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    #event-list {
      max-width: 100%;
      width: var(--max-width);
      margin: 0 auto;
      padding: 12px;
      background: var(--background);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    #event-list h2 {
      color: var(--primary);
      margin-top: 0;
    }

    .event-item {
      padding: 8px 0;
      border-bottom: 1px solid var(--background)
    }

    .event-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .event-title {
      font-weight: 600;
      color: var(--text-on-bg);
    }

    .event-meta {
      color: var(--primary);
      font-size: 0.95em
    }

    .fc-header-toolbar {
      flex-wrap: wrap;
      row-gap: 8px;
    }

    /* FullCalendar theme overrides */
    .fc {
      --fc-border-color: var(--primary);
      --fc-daygrid-event-dot-color: var(--primary);
      --fc-list-event-hover-bg-color: var(--background);
      --fc-today-bg-color: rgba(54, 98, 49, 0.12);
      --fc-page-bg-color: var(--background);
      --fc-neutral-bg-color: var(--background);
      --fc-button-text-color: var(--text-on-primary);
      --fc-button-bg-color: var(--primary);
      --fc-button-border-color: var(--primary);
      --fc-button-hover-bg-color: #2a4d26;
      --fc-button-hover-border-color: #2a4d26;
      --fc-button-active-bg-color: #21401e;
      --fc-button-active-border-color: #21401e;
      --fc-event-bg-color: var(--primary);
      --fc-event-border-color: var(--primary);
      --fc-event-text-color: var(--text-on-primary);
      color: var(--text-on-bg);
    }

    /* Stronger overrides to ensure the primary/text colors apply when embedded */
    .fc .fc-toolbar-title {
      color: var(--text-on-bg) !important;
      font-family: Georgia, 'Times New Roman', serif;
    }

    .fc .fc-col-header-cell {
      background: var(--primary) !important;
      color: var(--text-on-primary) !important;
    }

    .fc .fc-col-header-cell-cushion {
      color: var(--text-on-primary) !important;
    }

    /* Make sure buttons and event elements use the defined colors */
    .fc .fc-button {
      color: var(--fc-button-text-color) !important;
      background-color: var(--fc-button-bg-color) !important;
      border-color: var(--fc-button-border-color) !important;
    }

    .fc .fc-button:hover {
      background-color: var(--fc-button-hover-bg-color) !important;
      border-color: var(--fc-button-hover-border-color) !important;
    }

    .fc .fc-event,
    .fc .fc-event-main {
      background-color: var(--fc-event-bg-color) !important;
      border-color: var(--fc-event-border-color) !important;
      color: var(--fc-event-text-color) !important;
    }

    @media(min-width:900px) {
      main {
        flex-direction: row;
        align-items: flex-start;
        gap: 24px
      }

      #calendar {
        flex: 1;
        order: 1;
      }

      #event-list {
        width: 320px;
        order: 2;
      }
    }
  </style>
</head>

<body>


  <main>
    <div id="calendar"></div>
    <aside id="event-list" aria-label="Upcoming events"></aside>
  </main>

  <!-- moment + moment-timezone + fullcalendar moment-timezone plugin for accurate named-timezone (DST-aware) rendering -->
  <script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/moment-timezone@0.5.43/builds/moment-timezone-with-data.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/moment-timezone@6.1.8/index.global.min.js"></script>
  <script>
    // Simple calendar loader for events.json
    (function(){
      const EVENTS_URL = 'https://raw.githubusercontent.com/rspindriftlabs/WCBCalProgram/main/events.json';
      const CENTRAL_TZ = 'America/Chicago';

      async function fetchEvents(){
        // Cache-bust to reduce stale CDN responses
        const res = await fetch(EVENTS_URL + '?t=' + Date.now(), { cache: 'no-store' });
        if(!res.ok) throw new Error('Failed to load events.json: ' + res.status);
        return res.json();
      }

      // Helpers to handle both plain-string and calendar-style object start/end values.
      const DATE_ONLY_RE = /^[0-9]{4}-[0-9]{2}-[0-9]{2}$/;
      const MIDNIGHT_UTC_RE = /T00:00:00(?:\.\d+)?Z$/;

      function readValue(val){
        // Accept either:
        // - string "YYYY-MM-DD" (date-only)
        // - string ISO "2026-09-03T19:00:00-05:00" or "2026-09-04T00:00:00Z"
        // - object { date: "YYYY-MM-DD" } or { dateTime: "...", timeZone: "..." }
        if(!val) return { raw: null, kind: null };
        if(typeof val === 'object'){
          if(val.date) return { raw: val.date, kind: 'date' };
          if(val.dateTime) return { raw: val.dateTime, kind: 'dateTime' };
          return { raw: null, kind: null };
        }
        if(typeof val === 'string'){
          if(DATE_ONLY_RE.test(val)) return { raw: val, kind: 'date' };
          return { raw: val, kind: 'dateTime' }; // treat anything with a T as dateTime (even if it's UTC midnight)
        }
        return { raw: null, kind: null };
      }

      // Decide whether this start/end represent an all-day event.
      // RULES:
      // - If start.kind === 'date' (YYYY-MM-DD) => all-day.
      // - Else if both start and end are dateTime strings that are midnight-UTC and the interval is whole days => all-day.
      // - Otherwise NOT all-day (timed event).
      function isAllDayPair(startVal, endVal){
        const s = readValue(startVal);
        const e = readValue(endVal);

        // explicit date-only --> all-day
        if(s.kind === 'date') return true;

        // If both provided as dateTime strings, and both end with UTC midnight,
        // treat as all-day only when they form whole-day spans (end - start is multiple of 24h).
        if(s.kind === 'dateTime' && e.kind === 'dateTime' && typeof s.raw === 'string' && typeof e.raw === 'string'){
          if(MIDNIGHT_UTC_RE.test(s.raw) && MIDNIGHT_UTC_RE.test(e.raw)){
            try{
              const startMs = new Date(s.raw).getTime();
              const endMs = new Date(e.raw).getTime();
              const msPerDay = 24 * 60 * 60 * 1000;
              if(endMs > startMs && ((endMs - startMs) % msPerDay) === 0){
                return true;
              }
            }catch(_){}
          }
        }

        // In all other cases do NOT treat as all-day.
        return false;
      }

      // Convert input list to FullCalendar events.
      function toFullCalendarEvents(list){
        return list.map(e => {
          const allDay = isAllDayPair(e.start, e.end);

          // start/end normalization: for all-day events use YYYY-MM-DD strings,
          // for timed events keep the original ISO/dateTime strings or objects.
          let startOut, endOut;
          const s = readValue(e.start);
          const en = readValue(e.end);

          if(allDay){
            // If we have date objects or dateTime midnight-Z, convert to YYYY-MM-DD
            if(s.kind === 'date') startOut = s.raw;
            else if(typeof s.raw === 'string') startOut = s.raw.slice(0,10);
            else startOut = e.start;

            if(en && en.raw){
              if(en.kind === 'date') endOut = en.raw;
              else if(typeof en.raw === 'string') endOut = en.raw.slice(0,10);
              else endOut = e.end;
            }
          } else {
            // timed events: preserve dateTime strings/objects (so timezone offsets are preserved).
            startOut = (s.raw !== null) ? s.raw : e.start;
            endOut = (en.raw !== null) ? en.raw : e.end;
          }

          return {
            id: e.id,
            title: e.title,
            start: startOut,
            end: endOut,
            allDay: !!allDay,
            extendedProps: { location: e.location }
          };
        });
      }

      // Parsing helper for list comparisons and display.
      function parseEventDateForDisplay(s){
        if(!s) return null;
        // Accept object forms:
        if(typeof s === 'object'){
          if(s.date) return new Date(s.date + 'T00:00:00');
          if(s.dateTime) return new Date(s.dateTime);
          return null;
        }
        // string forms
        if(typeof s === 'string' && DATE_ONLY_RE.test(s)) return new Date(s + 'T00:00:00');
        return new Date(s);
      }

      function formatCentralDate(d){
        return d.toLocaleDateString('en-US', {year:'numeric', month:'short', day:'numeric', timeZone: CENTRAL_TZ});
      }
      function formatCentralTime(d){
        return d.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit', timeZone: CENTRAL_TZ});
      }

      function dateAddDays(d, days){
        const nd = new Date(d.getTime());
        nd.setDate(nd.getDate() + days);
        return nd;
      }

     function renderEventList(list){
        const container = document.getElementById('event-list');
        if(!container) return;
        container.innerHTML = '<h2>Upcoming</h2>';

        const now = new Date();

        // include only events that haven't finished yet
        const upcoming = list.filter(e => {
          const end = e.end ? parseEventDateForDisplay(e.end) : parseEventDateForDisplay(e.start);
          return end && end >= now;
        });

        const sortedList = [...upcoming].sort((a,b) => parseEventDateForDisplay(a.start) - parseEventDateForDisplay(b.start));

        if(!sortedList.length){ container.innerHTML += '<p>No upcoming events</p>'; return }

        // Limit the rendering to the first N events
        const maxEvents = 8;
        const limitedList = sortedList.slice(0, maxEvents);

        limitedList.forEach(e => {
          const div = document.createElement('div');
          div.className = 'event-item';
          const title = document.createElement('div');
          title.className = 'event-title';
          title.textContent = e.title;
          const meta = document.createElement('div');
          meta.className = 'event-meta';

          const start = parseEventDateForDisplay(e.start);
          const end = e.end ? parseEventDateForDisplay(e.end) : null;

          let dateStr = '';
          if(e.allDay){
            if(end){
              const displayEnd = dateAddDays(end, -1);
              const startStr = start.toLocaleDateString(undefined, {year:'numeric',month:'short',day:'numeric'});
              const endStr = displayEnd.toLocaleDateString(undefined, {year:'numeric',month:'short',day:'numeric'});
              dateStr = startStr === endStr ? startStr : (startStr + ' — ' + endStr);
            } else {
              dateStr = start.toLocaleDateString(undefined, {year:'numeric',month:'short',day:'numeric'});
            }
          } else {
            // timed events: show in Central Time so CT events (like 7pm) don't shift to other days.
            if(start) {
              const startStr = formatCentralDate(start) + ' ' + formatCentralTime(start) + ' CT';
              if(end){
                const endStr = formatCentralDate(end) + ' ' + formatCentralTime(end) + ' CT';
                dateStr = startStr + ' — ' + endStr;
              } else {
                dateStr = startStr;
              }
            }
          }

          meta.textContent = dateStr + (e.extendedProps && e.extendedProps.location ? ' · ' + e.extendedProps.location : '');
          div.appendChild(title);
          div.appendChild(meta);
          container.appendChild(div);
        });


      }

      async function init(){
        try{
          const raw = await fetchEvents();
          const events = toFullCalendarEvents(raw);

          // render fullcalendar
          const calendarEl = document.getElementById('calendar');
          const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek,listWeek' },
            height: 'auto',
            // Use named, DST-aware Central timezone via the moment-timezone plugin so
            // event times displayed on the calendar grid are always accurate Central Time.
            timeZone: CENTRAL_TZ,
            plugins: [ FullCalendar.MomentTimezonePlugin ? FullCalendar.MomentTimezonePlugin : undefined ].filter(Boolean),
            events: events,
            eventDidMount: info => {
              if (info.event.extendedProps.location) {
                info.el.title = info.event.extendedProps.location;
              }
            },
            // improve accessibility: announce when events are focused
            eventClick: info => {
              // show simple alert with details (replace with modal if desired), always in Central Time
              const loc = info.event.extendedProps.location || 'No location';
              let when = '';
              if (info.event.allDay) {
                const s = info.event.start ? info.event.start.toLocaleDateString(undefined, {year:'numeric',month:'short',day:'numeric'}) : '';
                const en = info.event.end ? info.event.end.toLocaleDateString(undefined, {year:'numeric',month:'short',day:'numeric'}) : '';
                when = s + (en ? ' — ' + en : '');
              } else {
                const s = info.event.start ? (formatCentralDate(info.event.start) + ' ' + formatCentralTime(info.event.start) + ' CT') : '';
                const en = info.event.end ? (formatCentralDate(info.event.end) + ' ' + formatCentralTime(info.event.end) + ' CT') : '';
                when = s + (en ? ' — ' + en : '');
              }
              alert(`${info.event.title}\n${when}\n${loc}`);
            }
          });
          calendar.render();

          // render list using the same event objects so allDay and timezone-stripping are consistent
          renderEventList(events);

        }catch(err){
          console.error(err);
          const el = document.getElementById('calendar');
          el.innerHTML = '<p style="color:#900;padding:16px">Failed to load calendar data.</p>';
          const list = document.getElementById('event-list');
          list.innerHTML = '<p style="color:#900">Failed to load events.</p>';
        }
      }

      // init on DOM ready
      if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
    })();
  </script>
</body>

</html>
