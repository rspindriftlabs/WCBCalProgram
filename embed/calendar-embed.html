
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WCB Calendar</title>
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
  <style>
    /* Simple styles for the embeddable calendar */
    :root {
      --max-width: 900px;
      --primary: #366231;
      --background: #FFFFFF;
      --text-on-bg: #000000;
      --text-on-primary: #FFFFFF;
      --border: #FFFFFF;
    }

    * {
      box-sizing: border-box
    }

    html {
      overflow: hidden;
      height: auto;
      margin: 0;
      padding: 0;
    }

    body {
      overflow: hidden;
      height: auto;
      font-family: Georgia, 'Times New Roman', serif;
      margin: 16px;
      color: var(--text-on-bg);
      background: var(--background);
    }

    header {
      text-align: center;
      margin-bottom: 16px
    }

    header h1 {
      color: #000000;
      font-family: Georgia, 'Times New Roman', serif;
    }

    #calendar {
      max-width: 100%;
      width: var(--max-width);
      margin: 0 auto 24px
    }

    .subtitle {
      color: #000000;
      margin: 6px 0
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      height: auto;
      min-height: 0;
      max-width: 100%;
      overflow: hidden;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    #event-list {
      max-width: 100%;
      width: var(--max-width);
      margin: 0 auto;
      padding: 12px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    #event-list h2 {
      color: var(--primary);
      margin-top: 0;
    }

    .event-item {
      padding: 8px 0;
      border-bottom: 1px solid var(--background)
    }

    .event-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .event-title {
      font-weight: 600;
      color: var(--text-on-bg);
    }

    .event-meta {
      color: var(--primary);
      font-size: 0.95em
    }

    .fc-header-toolbar {
      flex-wrap: wrap;
      row-gap: 8px;
    }

    /* FullCalendar theme overrides */
    .fc {
      --fc-border-color: var(--primary);
      --fc-daygrid-event-dot-color: var(--primary);
      --fc-list-event-hover-bg-color: var(--background);
      --fc-today-bg-color: rgba(54, 98, 49, 0.12);
      --fc-page-bg-color: #ffffff;
      --fc-neutral-bg-color: var(--background);
      --fc-button-text-color: var(--text-on-primary);
      --fc-button-bg-color: var(--primary);
      --fc-button-border-color: var(--primary);
      --fc-button-hover-bg-color: #2a4d26;
      --fc-button-hover-border-color: #2a4d26;
      --fc-button-active-bg-color: #21401e;
      --fc-button-active-border-color: #21401e;
      --fc-event-bg-color: var(--primary);
      --fc-event-border-color: var(--primary);
      --fc-event-text-color: var(--text-on-primary);
      color: var(--text-on-bg);
    }

    .fc .fc-toolbar-title {
      color: #000000;
      font-family: Georgia, 'Times New Roman', serif;
    }

    .fc .fc-col-header-cell {
      background: var(--primary);
      color: var(--text-on-primary);
    }

    .fc .fc-col-header-cell-cushion {
      color: var(--text-on-primary);
    }

    @media(min-width:900px) {
      main {
        flex-direction: row;
        align-items: flex-start;
        gap: 24px
      }

      #calendar {
        flex: 1;
        order: 1;
      }

      #event-list {
        width: 320px;
        order: 2;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>WCB Events</h1>
    <p class="subtitle">An embeddable calendar driven from events.json in this repository.</p>
  </header>

  <main>
    <div id="calendar"></div>
    <aside id="event-list" aria-label="Upcoming events"></aside>
  </main>


  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  <script>
    // Simple calendar loader for events.json
    (function(){
      const EVENTS_URL = 'https://raw.githubusercontent.com/rspindriftlabs/WCBCalProgram/main/events.json';

      async function fetchEvents(){
        // Cache-bust to reduce stale CDN responses
        const res = await fetch(EVENTS_URL + '?t=' + Date.now(), { cache: 'no-store' });
        if(!res.ok) throw new Error('Failed to load events.json: ' + res.status);
        return res.json();
      }

      function toFullCalendarEvents(list){
        return list.map(e => ({
          id: e.id,
          title: e.title,
          start: e.start,
          end: e.end,
          allDay: (e.start && e.start.endsWith('T00:00:00.000Z')),
          extendedProps: { location: e.location }
        }));
      }

     function renderEventList(list){
        const container = document.getElementById('event-list');
        container.innerHTML = '<h2>Upcoming</h2>';

        const now = new Date();

        // Only include events that haven't started yet (or are still ongoing
        // if they have an end date in the future), then sort ascending so the
        // soonest upcoming event appears at the very top.
        const upcoming = list.filter(e => {
          const end = e.end ? new Date(e.end) : new Date(e.start);
          return end >= now;
        });

        const sortedList = [...upcoming].sort((a, b) => new Date(a.start) - new Date(b.start));

        if(!sortedList.length){ container.innerHTML += '<p>No upcoming events</p>'; return }

        // Limit the rendering to the first N events
        const maxEvents = 5;
        const limitedList = sortedList.slice(0, maxEvents);

        limitedList.forEach(e => {
          const div = document.createElement('div');
          div.className = 'event-item';
          const title = document.createElement('div');
          title.className = 'event-title';
          title.textContent = e.title;
          const meta = document.createElement('div');
          meta.className = 'event-meta';
          const start = new Date(e.start);
          const end = e.end ? new Date(e.end) : null;
          const dateStr = start.toLocaleDateString(undefined, {year:'numeric',month:'short',day:'numeric'}) + (end ? ' — ' + end.toLocaleDateString(undefined, {year:'numeric',month:'short',day:'numeric'}) : '');
          meta.textContent = dateStr + (e.location ? ' · ' + e.location : '');
          div.appendChild(title);
          div.appendChild(meta);
          container.appendChild(div);
        });


      }

      async function init(){
        try{
          const raw = await fetchEvents();
          const events = toFullCalendarEvents(raw);

          // render fullcalendar
          const calendarEl = document.getElementById('calendar');
          const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek,listWeek' },
            height: 'auto',
            events: events,
            eventDidMount: info => {
              if (info.event.extendedProps.location) {
                info.el.title = info.event.extendedProps.location;
              }
            },
            // improve accessibility: announce when events are focused
            eventClick: info => {
              // show simple alert with details (replace with modal if desired)
              const loc = info.event.extendedProps.location || 'No location';
              const start = info.event.start ? info.event.start.toLocaleString() : '';
              const end = info.event.end ? info.event.end.toLocaleString() : '';
              const when = start + (end ? ' — ' + end : '');
              alert(`${info.event.title}\n${when}\n${loc}`);
            }
          });
          calendar.render();

          // render list
          renderEventList(raw);

        }catch(err){
          console.error(err);
          const el = document.getElementById('calendar');
          el.innerHTML = '<p style="color:#900;padding:16px">Failed to load calendar data.</p>';
          const list = document.getElementById('event-list');
          list.innerHTML = '<p style="color:#900">Failed to load events.</p>';
        }
      }

      // init on DOM ready
      if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
    })();
  </script>
</body>

</html>
