<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WCB Calendar - View upcoming events from Google Calendar">
    <title>WCB Calendar</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            margin: 0 0 10px 0;
            color: #1f2937;
        }
        
        .header p {
            margin: 0;
            color: #6b7280;
            font-size: 14px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📅 WCB Calendar</h1>
            <p>Events from Google Calendar</p>
        </div>
        
        <div id="wcb-calendar"></div>
    </div>

    <script src="js/calendar.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            WCBCalendar.init({
                // Replace with your iCal URL
                icalUrl: 'https://calendar.google.com/calendar/ical/YOUR_CALENDAR_ID%40gmail.com/public/basic.ics',
                elementId: 'wcb-calendar',
                theme: 'light',
                maxEvents: 10,
                daysAhead: 30
            });
        });
    </script>
</body>
</html>
