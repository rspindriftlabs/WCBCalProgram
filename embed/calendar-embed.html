<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WCB Calendar</title>
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet" />
  <style>
    /* Simple styles for the embeddable calendar (kept from original) */
    :root {
      --max-width: 900px;
      --primary: #366231;
      --background: #FFFFFF;
      --text-on-bg: #000000;
      --text-on-primary: #FFFFFF;
      --border: #FFFFFF;
    }

    * {
      box-sizing: border-box
    }

    html {
      overflow: hidden;
      height: auto;
      margin: 0;
      padding: 0;
    }

    body {
      overflow: hidden;
      height: auto;
      font-family: Georgia, 'Times New Roman', serif;
      margin: 16px;
      color: var(--text-on-bg);
      background: var(--background);
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      height: auto;
      min-height: 0;
      max-width: 100%;
      overflow: hidden;
      margin-bottom: 0;
      padding-bottom: 0;
      gap: 24px;
    }

    #calendar {
      width: 100%;
      max-width: 900px;
      background: var(--background);
      border-radius: 8px;
      border: 1px solid var(--border);
      padding: 8px;
    }

    #event-list {
      max-width: 100%;
      width: var(--max-width);
      margin: 0 auto;
      padding: 12px;
      background: var(--background);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    #event-list h2 {
      color: var(--primary);
      margin-top: 0;
    }

    .event-item {
      padding: 8px 0;
      border-bottom: 1px solid var(--background)
    }

    .event-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .event-title {
      font-weight: 600;
      color: var(--text-on-bg);
    }

    .event-meta {
      color: var(--primary);
      font-size: 0.95em
    }

    .event-desc {
      color: #333;
      font-size: 0.9em;
      margin-top: 6px;
    }

    @media(min-width:900px) {
      main {
        flex-direction: row;
        align-items: flex-start;
        gap: 24px
      }

      #event-list {
        width: 360px;
      }

      #calendar {
        width: 720px;
      }
    }
  </style>
</head>

<body>

  <main>
    <div id="calendar"></div>
    <aside id="event-list" aria-label="Upcoming events"></aside>
  </main>

  <!-- moment + moment-timezone for accurate named-timezone (DST-aware) rendering -->
  <script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/moment-timezone@0.5.43/builds/moment-timezone-with-data.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.js"></script>
  <script>
    (function(){
      const EVENTS_URL = 'https://raw.githubusercontent.com/rspindriftlabs/WCBCalProgram/main/events.json';
      const CENTRAL_TZ = 'America/Chicago';

      async function fetchEvents(){
        const res = await fetch(EVENTS_URL + '?t=' + Date.now(), { cache: 'no-store' });
        if(!res.ok) throw new Error('Failed to load events.json: ' + res.status);
        return res.json();
      }

      // Treat as all-day only when the stored UTC midnight also corresponds to midnight in CENTRAL_TZ.
      function isAllDayISO(s){
        if (typeof s !== 'string') return false;
        if (!/T00:00:00(?:\.\d{1,3})?Z$/.test(s)) return false;
        try {
          const m = moment.tz(s, 'UTC').tz(CENTRAL_TZ);
          return m.hour() === 0 && m.minute() === 0 && m.second() === 0;
        } catch (err){
          return false;
        }
      }

      function toEvents(list){
        return list.map(e => {
          const startRaw = e.start;
          const endRaw = e.end;

          const allDay = isAllDayISO(startRaw) || (typeof startRaw === 'string' && startRaw.length === 10);

          // Compute convenient moments for comparisons (UTC instants)
          let startInstant = null;
          let endInstant = null;

          if(allDay){
            const startDate = (typeof startRaw === 'string' && startRaw.length > 10) ? startRaw.slice(0,10) : startRaw;
            startInstant = moment.tz(startDate, 'YYYY-MM-DD', CENTRAL_TZ).startOf('day').utc();

            if(endRaw){
              const endDate = (typeof endRaw === 'string' && endRaw.length > 10) ? endRaw.slice(0,10) : endRaw;
              endInstant = moment.tz(endDate, 'YYYY-MM-DD', CENTRAL_TZ).startOf('day').utc();
            } else {
              endInstant = moment(startInstant).endOf('day').utc();
            }
          } else {
            startInstant = (typeof startRaw === 'string') ? moment.utc(startRaw) : moment(startRaw);
            if(endRaw) endInstant = (typeof endRaw === 'string') ? moment.utc(endRaw) : moment(endRaw);
            else endInstant = moment(startInstant).add(1, 'hours');
          }

          return {
            id: e.id,
            title: e.title || 'Busy',
            startRaw,
            endRaw,
            allDay,
            startInstant: startInstant ? startInstant.valueOf() : null,
            endInstant: endInstant ? endInstant.valueOf() : null,
            location: e.location || '',
            description: e.description || ''
          };
        });
      }

      function fcEventsFromRaw(list){
        // Convert to FullCalendar event objects, converting times to CENTRAL_TZ offsets
        return list.map(e => {
          const fc = {
            id: e.id,
            title: e.title || 'Busy',
            allDay: e.allDay,
            extendedProps: {
              location: e.location || '',
              description: e.description || ''
            }
          };

          if(e.allDay){
            // Use date-only strings for all-day events (FullCalendar treats end as exclusive)
            const startDate = (typeof e.startRaw === 'string' && e.startRaw.length > 10) ? e.startRaw.slice(0,10) : e.startRaw;
            fc.start = startDate;
            if(e.endRaw){
              const endDate = (typeof e.endRaw === 'string' && e.endRaw.length > 10) ? e.endRaw.slice(0,10) : e.endRaw;
              fc.end = endDate; // keep as provided (often exclusive)
            }
          } else {
            // Convert stored UTC instant to a CENTRAL_TZ offset ISO string so calendar shows CT times
            try {
              if(e.startRaw) fc.start = moment.utc(e.startRaw).tz(CENTRAL_TZ).format();
              if(e.endRaw) fc.end = moment.utc(e.endRaw).tz(CENTRAL_TZ).format();
            }catch(err){
              fc.start = e.startRaw;
              if(e.endRaw) fc.end = e.endRaw;
            }
          }

          return fc;
        });
      }

      function formatCentralDateTimeFromInstant(ms){
        return moment.utc(ms).tz(CENTRAL_TZ).format('MMM D, YYYY h:mm A') + ' CT';
      }

      function formatCentralDateFromInstant(ms){
        return moment.utc(ms).tz(CENTRAL_TZ).format('MMM D, YYYY');
      }

      function renderEventList(rawList){
        const container = document.getElementById('event-list');
        container.innerHTML = '<h2>Upcoming</h2>';

        const now = Date.now();

        const events = toEvents(rawList);

        const upcoming = events.filter(ev => ev.endInstant && ev.endInstant >= now);
        upcoming.sort((a,b) => (a.startInstant || 0) - (b.startInstant || 0));

        if(!upcoming.length){ container.innerHTML += '<p>No upcoming events</p>'; return }

        const maxEvents = 12;
        const limited = upcoming.slice(0, maxEvents);

        limited.forEach(e => {
          const div = document.createElement('div');
          div.className = 'event-item';

          const title = document.createElement('div');
          title.className = 'event-title';
          title.textContent = e.title;

          const meta = document.createElement('div');
          meta.className = 'event-meta';

          let dateStr = '';
          if(e.allDay){
            if(e.endRaw){
              const endDateStr = (typeof e.endRaw === 'string' && e.endRaw.length > 10) ? e.endRaw.slice(0,10) : e.endRaw;
              const displayEnd = moment.tz(endDateStr, 'YYYY-MM-DD', CENTRAL_TZ).subtract(1, 'day');
              const startDateStr = (typeof e.startRaw === 'string' && e.startRaw.length > 10) ? e.startRaw.slice(0,10) : e.startRaw;
              const startDisplay = moment.tz(startDateStr, 'YYYY-MM-DD', CENTRAL_TZ);
              dateStr = startDisplay.format('MMM D, YYYY');
              if(!startDisplay.isSame(displayEnd, 'day')) dateStr += ' — ' + displayEnd.format('MMM D, YYYY');
            } else {
              dateStr = formatCentralDateFromInstant(e.startInstant);
            }
          } else {
            dateStr = formatCentralDateTimeFromInstant(e.startInstant);
            if(e.endInstant) dateStr += ' — ' + formatCentralDateTimeFromInstant(e.endInstant);
          }

          meta.textContent = dateStr + (e.location ? ' · ' + e.location : '');

          div.appendChild(title);
          div.appendChild(meta);

          if(e.description){
            const desc = document.createElement('div');
            desc.className = 'event-desc';
            desc.textContent = e.description;
            div.appendChild(desc);
          }

          // Click to show details (includes description)
          div.style.cursor = 'pointer';
          div.addEventListener('click', () => {
            const loc = e.location || 'No location';
            const desc = e.description || 'No description';
            alert(`${e.title}\n${dateStr}\n${loc}\n\n${desc}`);
          });

          container.appendChild(div);
        });
      }

      let calendar = null;

      async function init(){
        try{
          const raw = await fetchEvents();

          // Render the side list as before
          renderEventList(raw);

          // Build FullCalendar events and mount the calendar
          const eventsForCalendar = fcEventsFromRaw(toEvents(raw));

          const calendarEl = document.getElementById('calendar');
          calendarEl.innerHTML = ''; // clear

          calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            headerToolbar: {
              left: 'prev,next today',
              center: 'title',
              right: 'dayGridMonth,timeGridWeek,timeGridDay,listWeek'
            },
            height: 'auto',
            navLinks: true,
            weekNumbers: false,
            editable: false,
            selectable: false,
            events: eventsForCalendar,
            eventClick: function(info){
              info.jsEvent.preventDefault();
              const ev = info.event;
              const loc = ev.extendedProps.location || 'No location';
              const desc = ev.extendedProps.description || 'No description';

              // Format date/time for display in CT
              let when = '';
              if(ev.allDay){
                const start = ev.start;
                const end = ev.end;
                if(end){
                  // FullCalendar's end for allDay is exclusive; show inclusive end as end - 1 day
                  const displayEnd = moment(end).subtract(1, 'day');
                  when = moment(start).format('MMM D, YYYY');
                  if(!moment(start).isSame(displayEnd, 'day')) when += ' — ' + displayEnd.format('MMM D, YYYY');
                } else {
                  when = moment(start).format('MMM D, YYYY');
                }
                when += ' (All day)';
              } else {
                if(ev.start) when = moment(ev.start).format('MMM D, YYYY h:mm A') + ' CT';
                if(ev.end) when += ' — ' + moment(ev.end).format('MMM D, YYYY h:mm A') + ' CT';
              }

              alert(`${ev.title}\n${when}\n${loc}\n\n${desc}`);
            }
          });

          calendar.render();

        }catch(err){
          console.error(err);
          const list = document.getElementById('event-list');
          list.innerHTML = '<p style="color:#900">Failed to load events.</p>';

          const calendarEl = document.getElementById('calendar');
          calendarEl.innerHTML = '<p style="color:#900">Failed to load calendar.</p>';
        }
      }

      if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
    })();
  </script>
</body>

</html>
